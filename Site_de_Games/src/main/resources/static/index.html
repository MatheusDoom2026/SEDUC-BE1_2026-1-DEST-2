<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam 2 - Gerenciador de Jogos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilo idêntico à Steam Store */
        :root {
            --steam-bg-dark: #101822;
            --steam-nav-bg: #171a21;
            --steam-card-bg: #16202d;
            --steam-card-header: #1b2838;
            --steam-input-bg: #0f1722;
            --steam-blue-text: #66c0f4;
            --steam-border: #2a475e;
            --steam-btn-green-top: #799905;
            --steam-btn-green-bottom: #536904;
            --steam-btn-blue-top: #47bfff;
            --steam-btn-blue-bottom: #1a9fff;
        }

        body {
            background-color: var(--steam-bg-dark);
            color: #c6d4df;
            font-family: "Motiva Sans", Arial, Helvetica, sans-serif;
        }

        /* Navbar da Steam */
        .steam-header {
            background-color: var(--steam-nav-bg);
            border-bottom: 2px solid var(--steam-border);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
        }

        .steam-brand {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .steam-brand span {
            color: var(--steam-blue-text);
        }

        /* Container & Cards */
        .card {
            background-color: var(--steam-card-bg);
            border: 1px solid var(--steam-border);
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            background-color: var(--steam-card-header);
            border-bottom: 1px solid var(--steam-border);
            color: var(--steam-blue-text);
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            border-top-left-radius: 2px !important;
            border-top-right-radius: 2px !important;
        }

        /* Inputs estilizados como a Steam Store */
        .form-control, .form-select {
            background-color: var(--steam-input-bg);
            border: 1px solid var(--steam-border);
            color: #ffffff;
            border-radius: 2px;
        }

        .form-control:focus, .form-select:focus {
            background-color: #182434;
            color: #ffffff;
            border-color: var(--steam-blue-text);
            box-shadow: 0 0 6px rgba(102, 192, 244, 0.4);
        }

        .form-control::placeholder {
            color: #566473;
        }

        /* Botão Verde de Compra da Steam */
        .btn-steam-green {
            background: linear-gradient(to bottom, var(--steam-btn-green-top) 5%, var(--steam-btn-green-bottom) 95%);
            border: none;
            color: #d2efa9;
            font-weight: bold;
            text-shadow: 0px -1px 0px rgba(0, 0, 0, 0.4);
            border-radius: 2px;
            transition: all 0.2s ease;
        }

        .btn-steam-green:hover {
            background: linear-gradient(to bottom, #a4cc09 5%, #637e06 95%);
            color: #ffffff;
            box-shadow: 0 0 8px rgba(164, 204, 9, 0.4);
        }

        /* Botão Azul */
        .btn-steam-blue {
            background: linear-gradient(to right, var(--steam-btn-blue-top) 0%, var(--steam-btn-blue-bottom) 100%);
            border: none;
            color: #ffffff;
            font-weight: bold;
            border-radius: 2px;
        }

        .btn-steam-blue:hover {
            background: linear-gradient(to right, #66c0f4 0%, #31a8ff 100%);
            color: #ffffff;
        }

        .btn-steam-outline {
            background-color: transparent;
            border: 1px solid var(--steam-border);
            color: var(--steam-blue-text);
            font-size: 0.85rem;
            border-radius: 2px;
        }

        .btn-steam-outline:hover {
            background-color: var(--steam-border);
            color: #ffffff;
        }

        /* Tabela */
        .table-steam {
            --bs-table-bg: #101822;
            --bs-table-border-color: var(--steam-border);
            color: #c6d4df;
        }

        .table-steam tbody tr {
            transition: background-color 0.15s ease;
        }

        .table-steam tbody tr:hover {
            background-color: #203043 !important;
            color: #ffffff;
        }

        /* Badges da Steam */
        .badge-steam-tag {
            background-color: #22384d;
            color: var(--steam-blue-text);
            border: 1px solid #2a475e;
            font-weight: normal;
        }

        .badge-steam-rating {
            background-color: rgba(102, 192, 244, 0.15);
            color: var(--steam-blue-text);
            border: 1px solid rgba(102, 192, 244, 0.3);
        }
    </style>
</head>
<body>

<!-- Header Estilo Steam 2 -->
<nav class="navbar navbar-expand-lg steam-header mb-4 py-3">
    <div class="container">
        <a class="navbar-brand steam-brand d-flex align-items-center gap-2" href="#">
            <i class="fa-brands fa-steam fs-1 text-primary"></i>
            <span>STEAM 2</span>
        </a>
        <span class="text-muted small d-none d-md-inline">LOJA & GERENCIADOR DE CATÁLOGO</span>
    </div>
</nav>

<div class="container pb-5">
    <div id="alertContainer"></div>

    <div class="row g-4">
        <!-- Formulário (Inicia totalmente limpo) -->
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center py-3">
                    <span><i class="fa-solid fa-cloud-arrow-up me-2"></i>Cadastrar Jogo na Loja</span>
                    <button type="button" class="btn btn-steam-outline" onclick="preencherHollowKnight()">
                        <i class="fa-solid fa-wand-magic-sparkles me-1"></i>Exemplo (Hollow Knight)
                    </button>
                </div>
                <div class="card-body">
                    <form id="formJogo">
                        <div class="mb-3">
                            <label for="titulo" class="form-label text-light">Título do Jogo *</label>
                            <input type="text" class="form-control" id="titulo" required placeholder="Ex: Hollow Knight">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="genero" class="form-label text-light">Gênero *</label>
                                <select class="form-select" id="genero" required>
                                    <option value="" disabled selected>Selecione</option>
                                    <option value="ACAO">Ação</option>
                                    <option value="AVENTURA">Aventura</option>
                                    <option value="RPG">RPG</option>
                                    <option value="ESTRATEGIA">Estratégia</option>
                                    <option value="ESPORTE">Esporte</option>
                                    <option value="CORRIDA">Corrida</option>
                                    <option value="TERROR">Terror</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="desenvolvedora" class="form-label text-light">Desenvolvedora</label>
                                <input type="text" class="form-control" id="desenvolvedora" placeholder="Ex: Team Cherry">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="classificacaoIndicativa" class="form-label text-light">Classificação</label>
                                <select class="form-select" id="classificacaoIndicativa">
                                    <option value="" selected>Nenhuma</option>
                                    <option value="LIVRE">Livre</option>
                                    <option value="DEZ">10 Anos</option>
                                    <option value="DOZE">12 Anos</option>
                                    <option value="DEZESSEIS">16 Anos</option>
                                    <option value="DEZOITO">18 Anos</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="dataLancamento" class="form-label text-light">Data Lançamento</label>
                                <input type="date" class="form-control" id="dataLancamento">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="preco" class="form-label text-light">Preço (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="preco" placeholder="46.99">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="plataforma" class="form-label text-light">Plataforma</label>
                                <input type="text" class="form-control" id="plataforma" placeholder="Ex: PC, Steam Deck">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="avaliacao" class="form-label text-light">Análises (Avaliação)</label>
                                <select class="form-select" id="avaliacao">
                                    <option value="" selected>Nenhuma</option>
                                    <option value="PESSIMO">Ligeiramente Negativas</option>
                                    <option value="REGULAR">Neutras</option>
                                    <option value="BOM">Ligeiramente Positivas</option>
                                    <option value="OTIMO">Muito Positivas</option>
                                    <option value="EXCELENTE">Extremamente Positivas</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3 align-self-end">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="multiplayer">
                                    <label class="form-check-label text-light" for="multiplayer">Multiplayer</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label text-light">Descrição / Sobre o Jogo</label>
                            <textarea class="form-control" id="descricao" rows="3" placeholder="Resumo do produto na loja..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-steam-green w-100 py-2 fs-6">
                            <i class="fa-solid fa-cart-plus me-2"></i>Adicionar à Loja Steam 2
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center py-3">
                    <span><i class="fa-solid fa-gamepad me-2"></i>Jogos Disponíveis na Steam 2</span>
                    <button class="btn btn-sm btn-steam-outline" onclick="carregarJogos()">
                        <i class="fa-solid fa-rotate-right me-1"></i>Atualizar
                    </button>
                </div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <input type="number" id="buscarIdInput" class="form-control" placeholder="Buscar produto por ID...">
                        <button class="btn btn-steam-blue" type="button" onclick="buscarJogoPorId()">Buscar</button>
                        <button class="btn btn-steam-outline" type="button" onclick="carregarJogos()">Limpar</button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-steam align-middle">
                            <thead>
                            <tr style="border-bottom: 2px solid var(--steam-border);">
                                <th>ID</th>
                                <th>Título</th>
                                <th>Gênero</th>
                                <th>Plataforma</th>
                                <th>Preço</th>
                                <th>Análises</th>
                            </tr>
                            </thead>
                            <tbody id="tabelaJogosBody">
                            <tr>
                                <td colspan="6" class="text-center text-muted">Carregando catálogo da Steam 2...</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/jogos';

    document.addEventListener('DOMContentLoaded', carregarJogos);

    function preencherHollowKnight() {
        document.getElementById('titulo').value = "Hollow Knight";
        document.getElementById('genero').value = "AVENTURA";
        document.getElementById('desenvolvedora').value = "Team Cherry";
        document.getElementById('classificacaoIndicativa').value = "DEZ";
        document.getElementById('dataLancamento').value = "2017-02-24";
        document.getElementById('preco').value = "46.99";
        document.getElementById('plataforma').value = "PC, Steam Deck";
        document.getElementById('multiplayer').checked = false;
        document.getElementById('avaliacao').value = "EXCELENTE";
        document.getElementById('descricao').value = "Forje seu próprio caminho em Hollow Knight! Uma aventura épica através de um reino arruinado de insetos e heróis.";
    }

    function obterValorOuNull(id) {
        const el = document.getElementById(id);
        return (el && el.value.trim() !== "") ? el.value : null;
    }

    async function carregarJogos() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Status HTTP: ' + response.status);
            const jogos = await response.json();
            renderizarTabela(jogos);
        } catch (error) {
            document.getElementById('tabelaJogosBody').innerHTML =
                '<tr><td colspan="6" class="text-center text-muted">Aguardando conexão com o servidor Steam 2...</td></tr>';
        }
    }

    async function buscarJogoPorId() {
        const id = document.getElementById('buscarIdInput').value;
        if (!id) {
            carregarJogos();
            return;
        }

        try {
            const response = await fetch(`${API_URL}/${id}`);
            if (!response.ok) {
                mostrarAlerta(`Jogo com ID #${id} não encontrado na loja.`, 'warning');
                return;
            }
            const jogo = await response.json();
            renderizarTabela([jogo]);
        } catch (error) {
            mostrarAlerta('Erro ao consultar por ID: ' + error.message, 'danger');
        }
    }

    document.getElementById('formJogo').addEventListener('submit', async function(e) {
        e.preventDefault();

        const dataInput = document.getElementById('dataLancamento').value;
        const precoInput = document.getElementById('preco').value;

        const novoJogo = {
            titulo: document.getElementById('titulo').value.trim(),
            genero: obterValorOuNull('genero'),
            desenvolvedora: obterValorOuNull('desenvolvedora'),
            classificacaoIndicativa: obterValorOuNull('classificacaoIndicativa'),
            dataLancamento: dataInput && dataInput !== "" ? dataInput : null,
            preco: precoInput !== "" ? parseFloat(precoInput) : null,
            plataforma: obterValorOuNull('plataforma'),
            multiplayer: document.getElementById('multiplayer').checked,
            avaliacao: obterValorOuNull('avaliacao'),
            descricao: obterValorOuNull('descricao')
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novoJogo)
            });

            if (response.ok) {
                mostrarAlerta('Jogo adicionado com sucesso ao catálogo da Steam 2!', 'success');
                document.getElementById('formJogo').reset();
                carregarJogos();
            } else {
                const erroTexto = await response.text();
                mostrarAlerta(`Erro (${response.status}): ${erroTexto}`, 'danger');
            }
        } catch (error) {
            mostrarAlerta('Erro na comunicação com a API: ' + error.message, 'danger');
        }
    });

    function renderizarTabela(jogos) {
        const tbody = document.getElementById('tabelaJogosBody');
        tbody.innerHTML = '';

        if (!jogos || jogos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Nenhum jogo cadastrado na biblioteca.</td></tr>';
            return;
        }

        jogos.forEach(jogo => {
            const precoFormatado = jogo.preco !== null && jogo.preco !== undefined ? `R$ ${jogo.preco.toFixed(2)}` : 'Gratuito';
            const tr = document.createElement('tr');

            tr.innerHTML = `
                    <td><span class="text-muted">#${jogo.id}</span></td>
                    <td class="fw-bold text-white">${jogo.titulo}</td>
                    <td><span class="badge badge-steam-tag">${jogo.genero || '-'}</span></td>
                    <td><small class="text-muted">${jogo.plataforma || '-'}</small></td>
                    <td class="text-info fw-bold">${precoFormatado}</td>
                    <td><span class="badge badge-steam-rating">${jogo.avaliacao || '-'}</span></td>
                `;
            tbody.appendChild(tr);
        });
    }

    function mostrarAlerta(mensagem, tipo) {
        const alertContainer = document.getElementById('alertContainer');
        alertContainer.innerHTML = `
                <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                    ${mensagem}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        setTimeout(() => {
            const alert = document.querySelector('.alert');
            if (alert) alert.remove();
        }, 4000);
    }
</script>
</body>
</html>
